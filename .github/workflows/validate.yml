name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install static-check dependencies
        run: sudo apt-get update && sudo apt-get install --yes jq ripgrep
      - name: Run repository checks
        run: tests/smoke.sh
